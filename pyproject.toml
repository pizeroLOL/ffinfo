[project]
name = "ffinfo-workspace"
version = "0.0.0"
description = "uv workspace root for ffinfo + ffinfo-cli"
requires-python = ">=3.14"
# 根是虚拟项目：不打包，但把两个成员拉成依赖，这样裸 `uv sync` 就能装全
dependencies = [
    "ffinfo",
    "ffinfo-cli",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ffinfo = { workspace = true }
ffinfo-cli = { workspace = true }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

# 默认走 PyPI —— 别人 clone 下来不该被引到某个特定镜像。
# 国内网络想显著加速，二选一（都别提交）：
#   1. 环境变量：export UV_DEFAULT_INDEX=https://mirrors.aliyun.com/pypi/simple/
#   2. 本地把下面三行取消注释
# [[tool.uv.index]]
# name = "aliyun"
# url = "https://mirrors.aliyun.com/pypi/simple/"
# default = true

[tool.uv]
package = false
# cache 与 .venv 不同文件系统，硬链接会失败；显式用 copy 消掉警告
link-mode = "copy"
# python-build-standalone 镜像。
# ⚠️ 实测：USTC 的 github-release 镜像对大文件是回源代理，仅 ~35 KB/s，
#    比直连还慢。仅在没有本地 Python 时才走这里，日常无需重装。
python-install-mirror = "https://mirrors.ustc.edu.cn/github-release/astral-sh/python-build-standalone"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "prek>=0.5.3",
    "pytest-cov",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["packages/*/src", "packages/*/tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff 专属
    "ANN",  # 强制类型标注
    "D",    # pydocstyle
]
ignore = [
    "D203",     # 与 D211 冲突
    "D213",     # 与 D212 冲突
    "D400",     # 中文句号「。」结尾是正常的
    "D403",     # 产品名（ffinfo / ffinfo-cli）小写开头是正常的
    "D415",
    "RUF001",   # 全角标点在中文注释里是正常的
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["D", "ANN"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pyright]
# ⚠️ include 里**不能写通配** —— pyright 不认 `packages/*/src` 这种写法，
# 会静默地一个文件都不分析（filesAnalyzed: 0），于是永远报 0 errors。
# 写死目录，让检查器真的跑起来。
include = [
    "packages/ffinfo/src",
    "packages/ffinfo/tests",
    "packages/ffinfo-cli/src",
    "packages/ffinfo-cli/tests",
]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# 测试向量模块（packages/ffinfo/tests/vectors.py）不在包内，显式告诉 pyright 去哪找
extraPaths = ["packages/ffinfo/tests"]

# pyrage / piccolo 的 wheel 里没有 .pyi / py.typed —— unknown 系列**按文件豁免**：
# 只有真正碰这两个依赖的文件（credentials.py / store.py + 三个直接查表的测试）带
# `# pyright:` 指令，其余文件照常检查。补存根（治本）记在待办里，补完把指令删掉。

[tool.pytest.ini_options]
testpaths = ["packages/*/tests"]
# 两个 tests 目录也在 path 上：测试向量模块（packages/ffinfo/tests/vectors.py）与
# 共享测试工具（packages/ffinfo-cli/tests/support.py）都要能被 import
pythonpath = [
    "packages/ffinfo/src",
    "packages/ffinfo-cli/src",
    "packages/ffinfo/tests",
    "packages/ffinfo-cli/tests",
]
asyncio_mode = "auto"
# 两个包各有同名 test 文件，用 importlib 模式避免 basename 冲突
# --cov 走 [tool.coverage]（source 钉死两个 src，不含 tests）
addopts = "-ra --strict-markers --import-mode=importlib --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["packages/ffinfo/src", "packages/ffinfo-cli/src"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
# 基线 ~94%（2026-09-23 实测 2930 stmt / 168 miss）。钉 90 留余量：
# 只挡「掉了好几个点」的回归，不为追平剩余死角挡提交。
fail_under = 90
