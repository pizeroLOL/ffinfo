name: CI

# 三平台矩阵：让"跨平台"从**声明**变成**事实**。
#
# 在此之前测试只在 Linux 容器里跑过 —— Windows 有一条跳过测试、macOS 一条专属测试都没有，
# 所以"支持 macOS / Windows"一直是句没有证据的话。这一份就是把证据补上。
#
# pyright 那一步现在是**真跑的**（include 写死目录之后，52 个文件 / 0 errors）。
# 依赖没存根带来的 unknown 系列在 pyproject 里豁免了，见那里的注释。
#
# **红了要有东西消费**：矩阵从加进来那天起，Windows 腿红过好几次，而没有任何东西因此停下来
# （产出代码的 agent 跑在 Linux，全自动、天然全绿；唯一能暴露 Windows 的信号没人看）。
# 所以：任一平台失败 → 把"哪条腿、哪一步、失败签名"写进 job summary（$GITHUB_STEP_SUMMARY）；
# AstrBot 侧另有定时任务把失败报到对话里。别指望"人记得去看"。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台红了，别把另外两个也掐掉 —— 那正是最需要看到的信息
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      # runner 在国外：显式钉住 PyPI，别受本地配置或镜像影响。
      # 锁文件已经钉死了版本与哈希，换源不改内容。
      UV_DEFAULT_INDEX: https://pypi.org/simple

    steps:
      - uses: actions/checkout@v4

      - name: 装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # 锁文件一变就换缓存键 —— 别拿旧缓存去测新依赖
          cache-dependency-glob: uv.lock

      - name: 装依赖
        id: deps
        # --frozen：锁文件必须被尊重，否则 CI 测的不是我们要发的东西
        run: uv sync --frozen

      # 四步检查：输出同时进 ci-logs/，红了由最后的"失败摘要"步骤收进 job summary。
      # `set -o pipefail` 不能省 —— 不然 tee 的 0 会把失败吞掉，步骤永远是绿的。
      - name: lint
        id: lint
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          uv run ruff check . 2>&1 | tee ci-logs/lint.log

      - name: 格式
        id: format
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          uv run ruff format --check . 2>&1 | tee ci-logs/format.log

      - name: 类型检查
        id: typecheck
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          uv run pyright --project pyproject.toml 2>&1 | tee ci-logs/typecheck.log

      - name: 测试
        id: test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          uv run pytest -q 2>&1 | tee ci-logs/test.log

      - name: 失败摘要
        if: failure()
        shell: bash
        run: |
          {
            echo "## ❌ ${{ matrix.os }} 红了"
            echo
            echo "| 步骤 | 结果 |"
            echo "| --- | --- |"
            echo "| 装依赖 | ${{ steps.deps.outcome }} |"
            echo "| lint | ${{ steps.lint.outcome }} |"
            echo "| 格式 | ${{ steps.format.outcome }} |"
            echo "| 类型检查 | ${{ steps.typecheck.outcome }} |"
            echo "| 测试 | ${{ steps.test.outcome }} |"
            echo
            echo "**失败签名**（测试那一步的 FAILED / ERROR 行）："
            echo
            echo '```'
            grep -E "^(FAILED|ERROR) " ci-logs/test.log 2>/dev/null | head -n 20 || echo "（没有 FAILED / ERROR 行）"
            echo '```'
            for name in lint format typecheck test; do
              log="ci-logs/$name.log"
              [ -f "$log" ] || continue
              echo
              echo "<details><summary>$name 日志最后 40 行</summary>"
              echo
              echo '```'
              tail -n 40 "$log"
              echo '```'
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"
