[project]
name = "ffinfo-cli"
version = "0.1.0"
description = "把 Firefox 数据（Sync + 本地 places.sqlite）拉到本地 SQLite，输出 JSON 给 agent"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MPL-2.0" }
dependencies = [
    "ffsync",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.9",
]

[project.scripts]
ffinfo = "ffinfo.cli:app"

[tool.uv.sources]
ffsync = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffinfo"]
