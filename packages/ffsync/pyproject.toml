[project]
name = "ffsync"
version = "0.1.0"
description = "纯 Python Firefox Sync 客户端库：OAuth · 密钥派生 · 记录解密 · 存储协议"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MPL-2.0" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffsync"]
